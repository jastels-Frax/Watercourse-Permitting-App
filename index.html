<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Field data collector for watercourse and wetland crossing assessments — L8006 NS-NB Reliability Intertie" />

  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Crossings" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a2e" />

  <title>Crossing Assessor</title>
  <link rel="manifest" href="./manifest.json" />

  <!-- iOS touch icons -->
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- ── App header ──────────────────────────────────────────────────────────── -->
<header class="app-header" id="app-header">
  <button id="btn-back" class="icon-btn header-back" aria-label="Back to record list" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
  </button>

  <img src="./assets/LOGO black bg.jpg" class="header-logo"
       alt="Fraxinus Environmental &amp; Geomatics" />

  <span class="header-title" id="header-title" aria-live="polite"></span>

  <button id="btn-menu" class="icon-btn header-menu" aria-label="Open settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<!-- ── Toast container ─────────────────────────────────────────────────────── -->
<div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

<!-- ── Settings drawer overlay ────────────────────────────────────────────── -->
<div id="drawer-overlay" class="drawer-overlay" aria-hidden="true"></div>

<!-- ── Settings drawer ────────────────────────────────────────────────────── -->
<aside id="settings-drawer" class="drawer" role="dialog" aria-modal="true"
       aria-label="App settings" aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-title">Settings</span>
    <button id="btn-drawer-close" class="icon-btn" aria-label="Close settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="drawer-body">
    <p class="helper-text">
      Default assessor name pre-fills every new record. You can still edit it
      per record before saving.
    </p>
    <div class="field-stack">
      <label class="field-label" for="s-assessor">
        Default Assessor Name
        <input type="text" id="s-assessor" class="field-input"
               placeholder="e.g. Jane Smith" autocomplete="name" />
      </label>
    </div>
    <div class="drawer-actions">
      <button id="btn-save-settings" class="btn btn-primary btn-block">
        Save Settings
      </button>
    </div>
  </div>
</aside>

<!-- ── Main application area ──────────────────────────────────────────────── -->
<main id="main">

  <!-- HOME screen — record list + export actions -->
  <section id="screen-home" class="screen" aria-label="Record list"></section>

  <!-- FORM screen — full crossing survey form -->
  <section id="screen-form" class="screen" aria-label="Crossing survey form" hidden></section>

</main>

<!-- ── Unsaved-changes modal ──────────────────────────────────────────────── -->
<div id="modal-unsaved" class="modal-backdrop" role="dialog" aria-modal="true"
     aria-labelledby="modal-title" hidden>
  <div class="modal-card">
    <p id="modal-title" class="modal-title">Unsaved changes</p>
    <p class="modal-body">Save as draft before leaving?</p>
    <div class="modal-actions">
      <button id="btn-modal-draft"   class="btn btn-primary  btn-block">Save Draft</button>
      <button id="btn-modal-discard" class="btn btn-danger   btn-block">Discard Changes</button>
      <button id="btn-modal-cancel"  class="btn btn-secondary btn-block">Keep Editing</button>
    </div>
  </div>
</div>

<script>
  /* Register service worker as early as possible */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('SW registration failed:', err));
    });
  }
</script>
<script src="./data.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
