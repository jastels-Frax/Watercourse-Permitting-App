<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Field data collector for watercourse and wetland crossing assessments — L8006 NS-NB Reliability Intertie" />

  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WC Assessor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a2e" />

  <title>Watercourse Assessor NTB</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════════
     APP HEADER — sticky, always visible.
     Back button: hidden on list view, visible on form view (JS-controlled).
     Logo: brand mark, always visible.
     Title: "Crossing Assessor" on list; crossing ID on form.
     Menu: opens settings drawer.
════════════════════════════════════════════════════════════════════════════ -->
<header class="app-header" id="app-header">

  <button id="btn-back" class="icon-btn header-back"
          aria-label="Back to record list" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true" width="22" height="22">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
  </button>

  <img src="./assets/LOGO black bg.jpg" class="header-logo"
       alt="Fraxinus Environmental &amp; Geomatics" />

  <span class="header-title" id="header-title" aria-live="polite">
    Watercourse Assessor NTB
  </span>

  <button id="btn-menu" class="icon-btn header-menu"
          aria-label="Open settings" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true" width="22" height="22">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83
               2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1
               1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65
               1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65
               1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1
               0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82
               l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9
               4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65
               0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1
               2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0
               1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

</header>

<!-- ── Toast container ─────────────────────────────────────────────────────── -->
<div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     SETTINGS DRAWER
     Always in DOM. open/close toggled via .open class on both overlay and
     drawer — keeps CSS transitions working without display:none thrash.
════════════════════════════════════════════════════════════════════════════ -->
<div id="drawer-overlay" class="drawer-overlay" aria-hidden="true"></div>

<aside id="settings-drawer" class="drawer"
       role="dialog" aria-modal="true" aria-label="App settings"
       aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-title">Settings</span>
    <button id="btn-drawer-close" class="icon-btn" aria-label="Close settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round"
           aria-hidden="true" width="22" height="22">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="drawer-body">
    <p class="helper-text">
      These defaults pre-fill every new record.
      You can still edit them per record before saving.
    </p>
    <div class="field-stack">
      <label class="field-label" for="s-assessor">
        Default Assessor Name
        <input type="text" id="s-assessor" class="field-input"
               placeholder="e.g. Jane Smith" autocomplete="name" />
      </label>
      <label class="field-label" for="s-project-id">
        Default Project ID
        <input type="text" id="s-project-id" class="field-input"
               placeholder="e.g. L8006-2026" autocomplete="off" />
      </label>
      <label class="field-label" for="s-watershed-primary">
        Default Primary Watershed
        <select id="s-watershed-primary" class="field-input">
          <option value="">— none —</option>
          <option value="Annapolis">Annapolis</option>
          <option value="Antigonish">Antigonish</option>
          <option value="Aspy">Aspy</option>
          <option value="Avon">Avon</option>
          <option value="Baddeck">Baddeck</option>
          <option value="Barrington">Barrington</option>
          <option value="Bear">Bear</option>
          <option value="Bras d'Or">Bras d'Or</option>
          <option value="Cheticamp">Cheticamp</option>
          <option value="Clyde">Clyde</option>
          <option value="Cornwallis">Cornwallis</option>
          <option value="East River Sheet Harbour">East River Sheet Harbour</option>
          <option value="Economy">Economy</option>
          <option value="Gaspereau">Gaspereau</option>
          <option value="Gold">Gold</option>
          <option value="Guysborough">Guysborough</option>
          <option value="Indian">Indian</option>
          <option value="Jordan">Jordan</option>
          <option value="Kennecook">Kennecook</option>
          <option value="LaHave">LaHave</option>
          <option value="L'Ardoise">L'Ardoise</option>
          <option value="Liscomb">Liscomb</option>
          <option value="Liverpool">Liverpool</option>
          <option value="Lockeport">Lockeport</option>
          <option value="Mahone">Mahone</option>
          <option value="Margaree">Margaree</option>
          <option value="Mersey">Mersey</option>
          <option value="Meteghan">Meteghan</option>
          <option value="Middle (Cape Breton)">Middle (Cape Breton)</option>
          <option value="Mira">Mira</option>
          <option value="Moser">Moser</option>
          <option value="Musquodoboit">Musquodoboit</option>
          <option value="Parrsboro">Parrsboro</option>
          <option value="Petite Rivière">Petite Rivière</option>
          <option value="Philip">Philip</option>
          <option value="Port Mouton">Port Mouton</option>
          <option value="Pubnico">Pubnico</option>
          <option value="Sackville">Sackville</option>
          <option value="Salmon (Colchester)">Salmon (Colchester)</option>
          <option value="Salmon (Yarmouth)">Salmon (Yarmouth)</option>
          <option value="Shubenacadie">Shubenacadie</option>
          <option value="St. Marys">St. Marys</option>
          <option value="Stewiacke">Stewiacke</option>
          <option value="Tangier">Tangier</option>
          <option value="Tidnish">Tidnish</option>
          <option value="Tusket">Tusket</option>
          <option value="Wallace">Wallace</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <div id="s-ws-other-wrap" hidden>
        <label class="field-label" for="s-watershed-primary-other">
          Specify primary watershed
          <input type="text" id="s-watershed-primary-other" class="field-input"
                 autocomplete="off" />
        </label>
      </div>
      <div id="s-ws-secondary-wrap" hidden>
        <label class="field-label" for="s-watershed-secondary">
          Default Secondary Watershed (name)
          <input type="text" id="s-watershed-secondary" class="field-input"
                 autocomplete="off" />
        </label>
      </div>
      <label class="field-label" for="s-priority">
        Default Priority Tier
        <select id="s-priority" class="field-input">
          <option value="">— none —</option>
          <option value="P1">P1 — High</option>
          <option value="P2">P2 — Medium</option>
          <option value="P3">P3 — Low</option>
        </select>
      </label>
    </div>
    <div class="drawer-actions">
      <button id="btn-save-settings" class="btn btn-primary btn-block">
        Save Settings
      </button>
    </div>
  </div>
</aside>

<!-- ═══════════════════════════════════════════════════════════════════════════
     MAIN — contains exactly two views; only one is visible at a time.
     showView() in app.js toggles the `hidden` attribute.
════════════════════════════════════════════════════════════════════════════ -->
<main id="main">

  <!-- VIEW: Record List (default, shown on load) -->
  <section id="view-list" class="screen"
           aria-label="Saved crossing records">
    <!-- Rendered dynamically by renderList() in app.js -->
  </section>

  <!-- VIEW: Survey Form (shown when a record is opened) -->
  <section id="view-form" class="screen"
           aria-label="Crossing survey form" hidden>
    <!-- Rendered dynamically by openRecord() in app.js -->
  </section>

</main>

<!-- ═══════════════════════════════════════════════════════════════════════════
     UNSAVED-CHANGES MODAL
     Shown by openUnsavedModal() when the user tries to leave a dirty form.
     Three actions: Save Draft → Discard → Keep Editing.
════════════════════════════════════════════════════════════════════════════ -->
<div id="modal-unsaved" class="modal-backdrop"
     role="dialog" aria-modal="true" aria-labelledby="modal-unsaved-title"
     hidden>
  <div class="modal-card">
    <p id="modal-unsaved-title" class="modal-title">Unsaved changes</p>
    <p class="modal-body">
      You have unsaved changes on this record. What would you like to do?
    </p>
    <div class="modal-actions">
      <button id="btn-modal-draft"   class="btn btn-primary   btn-block">Save Draft</button>
      <button id="btn-modal-discard" class="btn btn-danger    btn-block">Discard Changes</button>
      <button id="btn-modal-cancel"  class="btn btn-secondary btn-block">Keep Editing</button>
    </div>
  </div>
</div>

<div id="modal-confirm" class="modal-backdrop"
     role="dialog" aria-modal="true" aria-labelledby="modal-confirm-msg"
     hidden>
  <div class="modal-card">
    <p id="modal-confirm-msg" class="modal-body"></p>
    <div class="modal-actions">
      <button id="btn-confirm-ok"     class="btn btn-danger    btn-block">Confirm</button>
      <button id="btn-confirm-cancel" class="btn btn-secondary btn-block">Cancel</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     SERVICE WORKER REGISTRATION
     Runs before defer scripts so caching starts as early as possible.
════════════════════════════════════════════════════════════════════════════ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        // When a new SW takes control, reload once to serve fresh assets
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      }).catch(err => console.warn('SW registration failed:', err));
    });
  }
</script>

<!-- data.js must load before app.js (CA namespace dependency) -->
<script src="./data.js"              defer></script>
<script src="./lib/jspdf.umd.min.js" defer></script>
<script src="./lib/oswald-fonts.js"  defer></script>
<script src="./app.js"               defer></script>
</body>
</html>
